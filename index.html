<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDR Calculator</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- 1. Base de données -->
  <script src="data/photoDatabase.js"></script>
  
  <!-- 2. Utilitaires -->
  <script src="utils/utils.js"></script>
  
  <!-- 3. Styles (variable globale appStyles) -->
  <script src="styles.js"></script>
  
  <!-- 4. Helpers (fonction globale renderSuggestion) -->
  <script type="text/babel" src="utils/helpers.js"></script>
  
  <!-- 5. Composants (variables globales) -->
  <script type="text/babel" src="components/Header.jsx"></script>
  <script type="text/babel" src="components/Menu.jsx"></script>
  <script type="text/babel" src="components/Footer.jsx"></script>
  <script type="text/babel" src="components/MainSection.jsx"></script>
  <script type="text/babel" src="components/CorrectionISO.jsx"></script>
  <script type="text/babel" src="components/CorrectionAperture.jsx"></script>
  <script type="text/babel" src="components/SettingsPage.jsx"></script>
  
  <!-- 6. Application principale -->
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
